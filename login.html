<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriAI - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F9FAFB;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card img {
            width: 150px;
            margin-bottom: 24px;
        }
        .login-card h2 {
            margin-top: 0;
            color: #111827;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .login-card p {
            color: #6B7280;
            margin-bottom: 32px;
            font-size: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }
        .input-group input {
            padding: 14px 16px;
            border-radius: 12px;
            border: 1.5px solid #E5E7EB;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .input-group input:focus {
            border-color: #4F46E5;
        }
        .alert-error {
            background-color: #FEE2E2;
            color: #B91C1C;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="assets/logo.svg" alt="NutriAI Logo">
        <h2>Bem-vindo de volta!</h2>
        <p>Acesse sua conta para ver seu progresso.</p>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error === 'CredenciaisInvalidas') {
                document.write('<div class="alert-error">E-mail ou senha incorretos.</div>');
            } else if (error === 'NãoAutenticado') {
                document.write('<div class="alert-error">Você precisa fazer login para acessar o app.</div>');
            }
        </script>

        <form action="Controller/api.php?action=login" method="POST">
            <div class="input-group">
                <input type="email" name="email" placeholder="Seu e-mail" required>
                <input type="password" name="senha" placeholder="Sua senha" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
        </form>

        <div style="margin-top: 24px;">
            <p class="login-text" style="margin: 0;">Não tem conta? <a href="index.html">Faça o Quiz</a></p>
        </div>
    </div>

</body>
</html>
